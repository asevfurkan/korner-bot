name: Korner Bot Run

on:
  schedule:
    # GitHub Actions zamanlaması en sık 5 dakikada bir çalışacak şekilde ayarlanabilir.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: korner-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Run bot script
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

      - name: Commit sent matches cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update sent matches cache [skip ci]"
          file_pattern: sent_matches.txt
