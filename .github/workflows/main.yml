name: Korner Bot

on:
  schedule:
    # --- SABAH VE ÖĞLE KUŞAĞI ---
    - cron: '34,35,36 7 * * *'   # 10:35 civarı
    - cron: '21,22,23 9 * * *'   # 12:22 civarı
    - cron: '34,35,36 8 * * *'   # 11:35 civarı
    - cron: '21,22,23 10 * * *'  # 13:22 civarı
    - cron: '34,35,36 10 * * *'  # 13:35 civarı
    - cron: '21,22,23 12 * * *'  # 15:22 civarı
    - cron: '34,35,36 12 * * *'  # 15:35 civarı
    - cron: '21,22,23 14 * * *'  # 17:22 civarı

    # --- 17:30 VE AKŞAM ÜSTÜ KUŞAĞI ---
    - cron: '04,05,06 15 * * *'  # 18:05 civarı
    - cron: '51,52,53 16 * * *'  # 19:52 civarı
    - cron: '34,35,36 16 * * *'  # 19:35 civarı
    - cron: '21,22,23 18 * * *'  # 21:22 civarı

    # --- AKŞAM VE GECE KUŞAĞI (Macaristan, Danimarka, İtalya vb.) ---
    - cron: '34,35,36 17 * * *'  # 20:35 civarı (Şu anki maçları yakalaması için)
    - cron: '21,22,23 19 * * *'  # 22:22 civarı
    - cron: '04,05,06 19 * * *'  # 22:05 civarı
    - cron: '34,35,36 19 * * *'  # 22:35 civarı
    - cron: '21,22,23 21 * * *'  # 00:22 civarı
    - cron: '34,35,36 20 * * *'  # 23:35 civarı
    - cron: '21,22,23 22 * * *'  # 01:22 civarı

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Kontrol Et
        uses: actions/checkout@v2

      - name: Python Kurulumu
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Gerekli Kütüphaneleri Kur
        run: pip install requests

      - name: Botu Başlat
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
