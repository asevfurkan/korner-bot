name: Korner Bot Run

on:
  schedule:
    - cron: '*/2 * * * *'  # Her 2 dakikada bir otomatik tetikler
  workflow_dispatch:      # Elle test etmek istediğinde

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # sent_matches.txt dosyasının kaydedilebilmesi için yazma izni

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run bot script
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Commit and push sent_matches cache
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update sent_matches cache [skip ci]"
          file_pattern: sent_matches.txt
